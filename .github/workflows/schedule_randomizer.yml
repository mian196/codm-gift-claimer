name: Dynamic Cron Scheduler

env:
  TZ: Asia/Karachi

on:
  schedule:
    # Runs every day at 0:00 UTC (5:00 AM PKT) to schedule today's claim after 5:00 AM PKT
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows you to manually trigger immediately to randomize the claim schedule at any time

jobs:
  randomize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Check out repository code
      uses: actions/checkout@v5
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Randomize execution schedule
      shell: python
      run: |
        import random
        import re
        from datetime import datetime, time, timedelta, timezone

        pkt = timezone(timedelta(hours=5), "PKT")
        utc = timezone.utc

        today_pkt = datetime.now(pkt).date()
        claim_time_pkt = datetime.combine(
            today_pkt,
            time(hour=random.randint(5, 23), minute=random.randint(0, 59)),
            tzinfo=pkt,
        )
        claim_time_utc = claim_time_pkt.astimezone(utc)
        cron_expr = f"{claim_time_utc.minute} {claim_time_utc.hour} * * *"

        filepath = ".github/workflows/claim_rewards.yml"
        with open(filepath, "r", encoding="utf-8") as f:
            content = f.read()

        # Safely find and replace the cron line
        new_content = re.sub(
            r"-\s*cron:\s*['\"].*?['\"]",
            f"- cron: '{cron_expr}'",
            content
        )

        with open(filepath, "w", encoding="utf-8") as f:
            f.write(new_content)

        print(
            "Stealth Scheduler: Successfully randomized daily trigger "
            f"to '{cron_expr}' UTC ({claim_time_pkt:%H:%M} PKT)."
        )

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add .github/workflows/claim_rewards.yml
        
        # Only commit and push if the cron schedule actually changed
        if git diff --staged --quiet; then
          echo "Stealth Scheduler: Randomized schedule matches the current schedule. Skipping commit."
        else
          git commit -m "chore(stealth): dynamically randomize daily claim schedule [skip ci]"
          git push
        fi
