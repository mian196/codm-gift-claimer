name: CODM Daily Gift Claimer

env:
  TZ: Asia/Karachi

on:
  schedule:
    # GitHub cron is UTC. This checks once per hour from 5:00 AM-11:00 PM PKT.
    - cron: '0 0-18 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the claim flow from the GitHub Actions tab

jobs:
  claim:
    runs-on: ubuntu-latest

    steps:
    - name: Pick today's PKT claim time
      id: run_window
      shell: python
      env:
        EVENT_NAME: ${{ github.event_name }}
        RANDOM_SEED: ${{ github.repository }}
      run: |
        import hashlib
        import os
        import random
        import time
        from datetime import datetime, time as datetime_time, timedelta, timezone

        pkt = timezone(timedelta(hours=5), "PKT")
        now = datetime.now(pkt)

        if os.environ["EVENT_NAME"] != "schedule":
            allowed = True
            sleep_seconds = 0
            message = "Manual run requested. Skipping random schedule gate."
        else:
            today = now.date()
            seed_input = f"{today.isoformat()}:{os.environ['RANDOM_SEED']}"
            seed = int.from_bytes(hashlib.sha256(seed_input.encode("utf-8")).digest(), "big")
            rng = random.Random(seed)

            start = datetime.combine(today, datetime_time(hour=5), tzinfo=pkt)
            target = start + timedelta(minutes=rng.randint(0, (19 * 60) - 1))

            allowed = now.hour == target.hour and 5 <= now.hour <= 23
            sleep_seconds = max(0, int((target - now).total_seconds())) if allowed else 0
            message = (
                f"Today's claim target is {target:%H:%M} PKT. "
                f"Current time is {now:%H:%M} PKT."
            )

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"allowed={str(allowed).lower()}\n")
            output.write(f"sleep_seconds={sleep_seconds}\n")

        print(message)
        if allowed and sleep_seconds:
            print(f"Waiting {sleep_seconds} seconds before claiming.")
            time.sleep(sleep_seconds)
        elif not allowed:
            print("Skipping this hourly check.")

    - name: Check out repository code
      if: steps.run_window.outputs.allowed == 'true'
      uses: actions/checkout@v5

    - name: Set up Python
      if: steps.run_window.outputs.allowed == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      if: steps.run_window.outputs.allowed == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium
        npx playwright install-deps chromium

    - name: Execute claimer script
      if: steps.run_window.outputs.allowed == 'true'
      env:
        # Pass your secure profiles and discord webhook from GitHub Secrets as environment variables
        CODM_PROFILES: ${{ secrets.CODM_PROFILES }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        python claimer.py
