name: CODM Daily Gift Claimer

on:
  schedule:
    # Runs every day at 5:00 AM UTC (adjust the hour in cron format to fit your local time)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allows you to manually trigger the claim flow from the GitHub Actions tab

jobs:
  claim:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium
        npx playwright install-deps chromium

    - name: Execute claimer script
      env:
        # Pass your secure profiles and discord webhook from GitHub Secrets as environment variables
        CODM_PROFILES: ${{ secrets.CODM_PROFILES }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python claimer.py
